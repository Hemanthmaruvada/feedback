{% extends "base.html" %}
{% block title %}Login – FeedbackHub{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%);">
    <div class="card" style="width: 400px; border-radius: 16px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div style="width:60px;height:60px;background:#ede9fe;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;">
                    <i class="fas fa-comment-dots fa-xl" style="color:#4f46e5;"></i>
                </div>
                <h3 class="fw-bold">FeedbackHub</h3>
                <p class="text-muted small">Admin Login</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control form-control-lg" placeholder="admin" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="fas fa-sign-in-alt me-2"></i> Sign In
                </button>
            </form>
            <div class="mt-3 text-center">
                <small class="text-muted">Default: admin / admin123</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
