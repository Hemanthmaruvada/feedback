<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #ede9fe 0%, #e0e7ff 100%); min-height: 100vh; display: flex; align-items: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center" style="max-width: 450px; margin: auto;">
        <div style="width:80px;height:80px;background:#d1fae5;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px;">
            <i class="fas fa-check-circle fa-2x" style="color:#059669;"></i>
        </div>
        <h2 class="fw-bold mb-2">Thank You!</h2>
        <p class="text-muted mb-1">Your feedback for <strong>{{ form.title }}</strong> has been submitted.</p>
        <p class="text-muted small">Your response has been recorded successfully.</p>
        <a href="javascript:window.close()" class="btn btn-outline-secondary mt-3">Close</a>
    </div>
</div>
</body>
</html>
